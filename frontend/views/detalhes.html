                            viewBox="0 0 16 16"

                </a>

                    href="usuarios.html"

                >

                            height="16"

                        </svg>
                    </span>
                    <span>
                        Usuários
                    </span>

        <!--CONTEÚDO-->

        <main class="flex-1 min-h-[calc(100vh-56px)] bg-[#f2f2f4] p-5 xl:p-6 2xl:p-8 overflow-y-auto">

            <!-- CABEÇALHO -->

            <div class="mb-6">
                <div class="flex items-center gap-3 mb-2">
                    <a
                        href="atividades.html"
                        class="text-[#6F0049] text-sm no-underline hover:underline"
                    >
                        Atividades
                    </a>
                    <span class="text-[#8e8e93]">
                        /
                    </span>
                    <span class="text-[#6e6e73] text-sm">
                        Detalhes
                    </span>
                </div>
                <h1
                    id="tituloPagina"
                    class="text-2xl xl:text-3xl font-bold text-[#1c1c1e]"
                >
                    Detalhes da atividade
                </h1>
            </div>

            <!--CARD PRINCIPAL-->

            <section class="w-full max-w-[1000px] bg-white border border-[#d1d1d6] rounded-[15px] shadow-sm p-6 xl:p-8">

                <!-- CÓDIGO + STATUS -->

                <div class="flex items-center justify-between gap-4 mb-6">
                    <div>
                        <span
                            id="codigoAtividade"
                            class="text-sm font-semibold text-[#6e6e73]"
                        >
                            #---
                        </span>

                        <h2
                            id="tituloAtividade"
                            class="text-xl xl:text-2xl font-bold text-[#1c1c1e] mt-1"
                        >
                            Carregando...
                        </h2>

                    </div>

                    <!-- STATUS -->

                    <span
                        id="statusAtividade"
                        class="px-4 py-2 rounded-full bg-[#f4e8f0] text-[#6F0049] text-sm font-semibold"
                    >
                        Pendente
                    </span>
                </div>

                <!-- LINHA -->

                <div class="border-t border-[#e5e5e7] mb-6">
                </div>

                <!-- INFORMAÇÕES -->

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                    <!-- RESPONSÁVEL -->

                    <div>
                        <label class="block text-xs font-semibold text-[#6e6e73] mb-1">
                            Responsável
                        </label>
                        <div
                            id="responsavelAtividade"
                            class="w-full min-h-[42px] bg-[#f8f8fa] border border-[#e1e1e5] rounded-[10px] px-3 py-2.5 text-sm text-[#1c1c1e] flex items-center"
                        >
                            -
                        </div>
                    </div>

                    <!-- PRIORIDADE -->

                    <div>

                        <label class="block text-xs font-semibold text-[#6e6e73] mb-1">
                            Prioridade
                        </label>
                        <div
                            id="prioridadeAtividade"
                            class="w-full min-h-[42px] bg-[#f8f8fa] border border-[#e1e1e5] rounded-[10px] px-3 py-2.5 text-sm text-[#1c1c1e] flex items-center"
                        >
                            -
                        </div>
                    </div>

                    <!-- DATA DE INÍCIO -->

                    <div>
                        <label class="block text-xs font-semibold text-[#6e6e73] mb-1">
                            Data de início
                        </label>
                        <div
                            id="dataInicioAtividade"
                            class="w-full min-h-[42px] bg-[#f8f8fa] border border-[#e1e1e5] rounded-[10px] px-3 py-2.5 text-sm text-[#1c1c1e] flex items-center"
                        >
                            -
                        </div>
                    </div>

                    <!-- DATA DE VENCIMENTO -->

                    <div>
                        <label class="block text-xs font-semibold text-[#6e6e73] mb-1">
                            Data de vencimento
                        </label>
                        <div
                            id="dataVencimentoAtividade"
                            class="w-full min-h-[42px] bg-[#f8f8fa] border border-[#e1e1e5] rounded-[10px] px-3 py-2.5 text-sm text-[#1c1c1e] flex items-center"

                            -
                        </div>

                    <!-- PARTICIPANTES -->

                        <label class="block text-xs font-semibold text-[#6e6e73] mb-1">

                    </div>

                    <!-- DESCRIÇÃO -->

                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-[#6e6e73] mb-1">
                            Descrição
                        </label>

                    <a

                    <!-- CANCELAR -->

                    <button
                        type="button"
                        id="btnCancelar"
                        class="px-5 py-2.5 rounded-[15px] border border-[#6F0049] bg-white text-[#6F0049] text-sm font-medium hover:bg-[#f4e8f0] transition-colors"
                    >
                        Cancelar atividade
                    </button>

                    <!-- CONCLUIR -->

                    <button
                        type="button"
                        id="btnConcluir"
                        class="px-5 py-2.5 rounded-[15px] bg-[#6F0049] text-white text-sm font-medium hover:opacity-90 transition-opacity"
                    >
                        Concluir atividade
                    </button>
                </div>
            </section>
        </main>

    <!-- JAVASCRIPT -->

    <script src="../assets/js/api.js"></script>
    <script>
        // DETALHES DA ATIVIDADE

        let tarefaAtual = null;

        function pegarId() {
            return new URLSearchParams(window.location.search).get('id');
        }

        function definirTexto(id, texto) {
            document.getElementById(id).textContent = texto;
        }

        function preencherAtividade(tarefa) {
            definirTexto('codigoAtividade', Formato.codigo(tarefa.id));
            definirTexto('tituloAtividade', tarefa.titulo || 'Sem título');
            definirTexto('tituloPagina', tarefa.titulo || 'Detalhes da atividade');
            definirTexto('responsavelAtividade', tarefa.responsavel || 'Não atribuído');
            definirTexto('prioridadeAtividade', Formato.rotuloPrioridade(tarefa.prioridade));
            definirTexto('dataInicioAtividade', Formato.data(tarefa.data_inicio));
            definirTexto('dataVencimentoAtividade', Formato.data(tarefa.data_conclusao));
            definirTexto('participantesAtividade', tarefa.participantes || 'Nenhum participante informado');
            definirTexto('descricaoAtividade', tarefa.descricao || 'Nenhuma descrição informada');
            atualizarVisualStatus(tarefa.status);
            verificarBotoes(tarefa.status);
        }

        function mostrarAtividadeNaoEncontrada(mensagem) {
            definirTexto('codigoAtividade', '#---');
            definirTexto('tituloPagina', 'Atividade não encontrada');
            definirTexto('tituloAtividade', 'Atividade não encontrada');
            definirTexto('statusAtividade', 'Não encontrada');
            ['responsavelAtividade', 'prioridadeAtividade', 'dataInicioAtividade',
             'dataVencimentoAtividade', 'participantesAtividade'].forEach(id => definirTexto(id, '-'));
            definirTexto('descricaoAtividade', mensagem);
            document.getElementById('btnCancelar').style.display = 'none';
            document.getElementById('btnConcluir').style.display = 'none';
        }

        function atualizarVisualStatus(status) {
            const elemento = document.getElementById('statusAtividade');
            elemento.textContent = Formato.rotuloStatus(status);
            elemento.className = 'px-4 py-2 rounded-full text-sm font-semibold';
            if (status === 'concluido') {
                elemento.classList.add('bg-[#e7e7e9]', 'text-[#54565B]');
            } else {
                elemento.classList.add('bg-[#f4e8f0]', 'text-[#6F0049]');
            }
        }

        function desabilitar(botao, desabilitado) {
            botao.disabled = desabilitado;
            botao.classList.toggle('opacity-50', desabilitado);
            botao.classList.toggle('cursor-not-allowed', desabilitado);
        }

        function verificarBotoes(status) {
            const encerrada = status === 'concluido' || status === 'cancelado';
            desabilitar(document.getElementById('btnConcluir'), encerrada);
            desabilitar(document.getElementById('btnCancelar'), encerrada);
        }

        async function carregarAtividade() {
            const id = pegarId();
            if (!id) {
                mostrarAtividadeNaoEncontrada('Código da atividade não informado.');
                return;
            }
            try {
                tarefaAtual = await Api.buscarTarefa(id);
                preencherAtividade(tarefaAtual);
            } catch (erro) {
                mostrarAtividadeNaoEncontrada(erro.message);
            }
        }

        async function mudarStatus(novoStatus, mensagemSucesso) {
            if (!tarefaAtual) return;
            try {
                const resposta = await Api.atualizarTarefa(tarefaAtual.id, { status: novoStatus });
                tarefaAtual = resposta.tarefa;
                preencherAtividade(tarefaAtual);
                alert(mensagemSucesso);
            } catch (erro) {
                alert('Não foi possível atualizar: ' + erro.message);
            }
        }

        document.getElementById('btnCancelar').addEventListener('click', function () {
            if (!confirm('Tem certeza que deseja cancelar esta atividade?')) return;
            mudarStatus('cancelado', 'Atividade cancelada com sucesso!');
        });

        document.getElementById('btnConcluir').addEventListener('click', function () {
            mudarStatus('concluido', 'Atividade concluída com sucesso!');
        });

        document.addEventListener('DOMContentLoaded', carregarAtividade);
    </script>
    <script src="../assets/js/sidebar.js"></script>
