<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home — Expresso</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>

<body class="corpo-dashboard">

    <header class="topo-app">
        <div class="topo-app-logo">
            <img src="../login/img/logo.png" alt="Pinhalense" class="logo-header">
        </div>
        <div class="topo-app-acoes">
            <button class="icone-topo" title="Notificações" aria-label="Notificações">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M6 9a6 6 0 1 1 12 0c0 3.4 1 5.1 1.6 6.1a1 1 0 0 1-.9 1.4H5.3a1 1 0 0 1-.9-1.4C5 14.1 6 12.4 6 9Z" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="icone-topo icone-avatar" title="Minha conta" aria-label="Minha conta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="8.5" r="3.3"/>
                    <path d="M4.8 19.5a7.2 7.2 0 0 1 14.4 0" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="app-corpo">

        <aside class="menu-lateral">
            <nav>
                <a href="home.html" data-pagina="home.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V20h3a1 1 0 0 0 1-1v-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Home
                </a>
                <a href="atividades.html" data-pagina="atividades.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="4" width="12" height="17" rx="1.5"/><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1Z"/><path d="M9 11h6M9 14.5h6M9 17.5h3.5" stroke-linecap="round"/></svg>
                    Atividades
                </a>
                <a href="relatorios.html" data-pagina="relatorios.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.3"/><path d="M12 3.7V12l6 3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Relatórios
                </a>
            </nav>
        </aside>

        <main class="conteudo-dashboard">

            <div class="linha-topo-conteudo">
                <h2 class="saudacao">
                    <span id="nome-logado">—</span>
                    <span class="separador-cargo" id="separador-cargo" style="display:none;">:</span>
                    <span class="cargo" id="cargo-logado"></span>
                </h2>

                <div class="campo-busca">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.3-4.3" stroke-linecap="round"/></svg>
                    <input type="text" id="campo-pesquisa" placeholder="Pesquisar">
                </div>
            </div>

            <div class="linha-cards-calendario">

                <section class="cartoes-resumo">
                    <div class="cartao-resumo">
                        <div class="icone-cartao icone-vinho">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3.5" width="14" height="17" rx="1.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4.5" stroke-linecap="round"/></svg>
                        </div>
                        <div>
                            <strong id="contagem-total">0</strong>
                            <span>Total de atividades</span>
                        </div>
                    </div>

                    <div class="cartao-resumo">
                        <div class="icone-cartao icone-escuro">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12.5 4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                        <div>
                            <strong id="contagem-concluido">0</strong>
                            <span>Concluído</span>
                        </div>
                    </div>

                    <div class="cartao-resumo">
                        <div class="icone-cartao icone-escuro">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.3"/><path d="M12 7.3V12l3.3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                        <div>
                            <strong id="contagem-andamento">0</strong>
                            <span>Em andamento</span>
                        </div>
                    </div>

                    <div class="cartao-resumo">
                        <div class="icone-cartao icone-escuro">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="5" width="15" height="14.5" rx="1.5"/><path d="M4.5 9.5h15M8.5 3.5v3M15.5 3.5v3" stroke-linecap="round"/></svg>
                        </div>
                        <div>
                            <strong id="contagem-pendente">0</strong>
                            <span>Pendente</span>
                        </div>
                    </div>
                </section>

                <section class="cartao-calendario">
                    <div class="calendario-cabecalho">
                        <span id="calendario-mes-ano">—</span>
                        <div class="calendario-navegacao">
                            <button id="calendario-anterior" aria-label="Mês anterior">‹</button>
                            <button id="calendario-proximo" aria-label="Próximo mês">›</button>
                        </div>
                    </div>
                    <div class="calendario-semana">
                        <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
                    </div>
                    <div class="calendario-grade" id="calendario-grade"></div>
                </section>
            </div>

            <section class="cartao-atividades">
                <h2>Minhas atividades</h2>

                <div class="abas-atividades" id="abas-atividades">
                    <button class="aba ativa" data-status="">Todas</button>
                    <button class="aba" data-status="pendente">Pendentes</button>
                    <button class="aba" data-status="em andamento">Em andamento</button>
                    <button class="aba" data-status="concluido">Concluídas</button>
                </div>

                <table class="tabela-atividades">
                    <tbody id="corpo-tabela-atividades"></tbody>
                </table>
                <p class="vazio" id="mensagem-vazio" style="display:none;">Nenhuma atividade encontrada.</p>
            </section>

        </main>
    </div>

    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/atividades.js"></script>
</body>

</html>
