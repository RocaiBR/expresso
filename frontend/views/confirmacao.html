<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Criada - Pinhalense</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="w-full h-screen overflow-hidden bg-[#f2f2f4] font-sans antialiased">

    <!-- =====================================================
         NAVBAR (TOPO PÚRPURA - IGUAL ÀS OUTRAS TELAS)
    ====================================================== -->
    <header class="w-full h-[56px] bg-[#6F0049] flex items-center justify-between px-6 shrink-0">

        <!-- LOGO -->
        <div class="logo-area">
            <img src="../assets/img/logobranca.png" alt="Pinhalense" class="h-[28px] w-auto block">
        </div>

        <!-- PARTE DIREITA DA NAVBAR -->
        <div class="flex items-center gap-[18px] text-white">

            <!-- NOTIFICAÇÕES -->
            <button class="bg-transparent border-0 text-white cursor-pointer flex items-center hover:opacity-80 transition-opacity" type="button" aria-label="Notificações">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"></path>
                </svg>
            </button>

            <!-- USUÁRIO -->
            <button class="bg-transparent border-0 text-white cursor-pointer flex items-center hover:opacity-80 transition-opacity" type="button" aria-label="Usuário">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"></path>
                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"></path>
                </svg>
            </button>

        </div>
    </header>


    <!-- =====================================================
         ESTRUTURA PRINCIPAL
    ====================================================== -->
    <div class="w-full h-[calc(100vh-56px)] flex">

        <!-- =================================================
             SIDEBAR (MENU LATERAL)
        ================================================== -->
        <aside class="w-[200px] h-full bg-white border-r border-[#e2e2e7] p-3 py-5 shrink-0">
            <nav class="flex flex-col gap-[6px]">

                <!-- HOME -->
                <a href="home.html" class="flex items-center gap-3 px-[14px] py-[10px] rounded-[10px] text-[#3a3a3c] text-sm font-medium no-underline hover:bg-[#f4e8f0] transition-colors">
                    <span class="flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4z"></path>
                        </svg>
                    </span>
                    <span>Home</span>
                </a>

                <!-- ATIVIDADES (ATIVO) -->
                <a href="atividades.html" class="flex items-center gap-3 px-[14px] py-[10px] rounded-[10px] bg-[#e8d0e0] text-[#1c1c1e] text-sm font-semibold no-underline">
                    <span class="flex items-center justify-center text-[#1c1c1e]">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M5.5 7a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zM5 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5"></path>
                            <path d="M9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.5zm0 1v2A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"></path>
                        </svg>
                    </span>
                    <span>Atividades</span>
                </a>

                <!-- RELATÓRIOS -->
                <a href="relatorios.html" class="flex items-center gap-3 px-[14px] py-[10px] rounded-[10px] text-[#3a3a3c] text-sm font-medium no-underline hover:bg-[#f4e8f0] transition-colors">
                    <span class="flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M1 11a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1zm5-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm5-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1z"></path>
                        </svg>
                    </span>
                    <span>Relatórios</span>
                </a>

                <!-- USUÁRIOS -->
                <a href="usuarios.html" class="flex items-center gap-3 px-[14px] py-[10px] rounded-[10px] text-[#3a3a3c] text-sm font-medium no-underline hover:bg-[#f4e8f0] transition-colors">
                    <span class="flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0M8 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4"></path>
                            <path d="M8.256 14a4.5 4.5 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10q.39 0 .74.025c.226-.341.496-.65.804-.918Q8.844 9.002 8 9c-5 0-6 3-6 4s1 1 1 1z"></path>
                        </svg>
                    </span>
                    <span>Usuários</span>
                </a>

            </nav>
        </aside>


        <!-- =================================================
             CONTEÚDO PRINCIPAL (TELA DE CONFIRMAÇÃO)
        ================================================== -->
        <main class="flex-1 h-full bg-[#f2f2f4] p-5 xl:p-6 2xl:p-8 overflow-y-auto flex flex-col gap-4">

            <!-- BOTÃO VOLTAR -->
            <div>
                <a href="atividades.html" class="inline-flex items-center gap-1.5 text-[#6F0049] font-semibold text-sm hover:underline no-underline">
                    <span>&lt; Voltar</span>
                </a>
            </div>

            <!-- TÍTULO E SUBTÍTULO DA PÁGINA -->
            <div>
                <h1 class="text-xl font-bold text-[#1c1c1e]">Atividade Criada</h1>
                <p class="text-xs text-[#6e6e73] mt-0.5">Confira as informações da atividade cadastrada</p>
            </div>

            <!-- CARD CENTRAL DE CONFIRMAÇÃO -->
            <div class="w-full max-w-[720px] mx-auto bg-white border border-[#d1d1d6] rounded-xl p-8 shadow-sm flex flex-col items-center gap-6 mt-2">

                <!-- ÍCONE DE CHECK E MENSAGEM -->
                <div class="flex flex-col items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" fill="none" viewBox="0 0 24 24" stroke="#1c1c1e" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                    </svg>
                    <h2 class="text-lg font-bold text-[#3a3a3c]">Atividade criada com sucesso!</h2>
                </div>

                <!-- FORMULÁRIO / INFORMAÇÕES CADASTRADAS (READONLY) -->
                <div class="w-full flex flex-col gap-4">

                    <!-- TÍTULO DA ATIVIDADE -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-semibold text-[#3a3a3c]">Título da atividades</label>
                        <input type="text" id="conf-titulo" readonly value="Organizar relatório mensal"
                            class="w-full border border-[#d1d1d6] rounded-lg p-2.5 text-xs xl:text-sm text-[#3a3a3c] bg-white outline-none">
                    </div>

                    <!-- DATAS (INÍCIO E VENCIMENTO) -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-semibold text-[#3a3a3c]">Data de início</label>
                            <input type="text" id="conf-dataInicio" readonly value=""
                                class="w-full border border-[#d1d1d6] rounded-lg p-2.5 text-xs xl:text-sm text-[#3a3a3c] bg-white outline-none">
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-semibold text-[#3a3a3c]">Data de vencimento</label>
                            <input type="text" id="conf-dataVencimento" readonly value=""
                                class="w-full border border-[#d1d1d6] rounded-lg p-2.5 text-xs xl:text-sm text-[#3a3a3c] bg-white outline-none">
                        </div>
                    </div>

                    <!-- ATRIBUIÇÕES (RESPONSÁVEL E PARTICIPANTES) -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-semibold text-[#3a3a3c]">Responsável</label>
                            <input type="text" id="conf-responsavel" readonly value=""
                                class="w-full border border-[#d1d1d6] rounded-lg p-2.5 text-xs xl:text-sm text-[#3a3a3c] bg-white outline-none">
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-semibold text-[#3a3a3c]">Participantes</label>
                            <input type="text" id="conf-participantes" readonly value=""
                                class="w-full border border-[#d1d1d6] rounded-lg p-2.5 text-xs xl:text-sm text-[#3a3a3c] bg-white outline-none">
                        </div>
                    </div>

                    <!-- PRIORIDADE -->
                    <div class="pt-1">
                        <p class="text-xs font-semibold text-[#3a3a3c]">
                            Prioridade: <span id="conf-prioridade" class="font-normal text-[#1c1c1e]">Alta</span>
                        </p>
                    </div>

                </div>

            </div>

            <!-- BOTÕES DE AÇÃO INFERIORES -->
            <div class="flex items-center justify-center gap-4 mt-2">
                <a href="nova-atividade.html"
                    class="bg-[#6F0049] hover:bg-[#560039] text-white font-medium text-xs xl:text-sm px-6 py-2.5 rounded-lg shadow-sm transition-colors no-underline">
                    Criar Nova
                </a>
                <a href="atividades.html"
                    class="border border-[#6F0049] text-[#6F0049] hover:bg-[#6F0049]/5 font-medium text-xs xl:text-sm px-6 py-2.5 rounded-lg transition-colors no-underline">
                    Ver Atividade
                </a>
            </div>

        </main>

    </div>

    <!-- SCRIPT DE PREENCHIMENTO AUTOMÁTICO COM DADOS DA ÚLTIMA ATIVIDADE -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ultimaAtividade = JSON.parse(localStorage.getItem('ultima_atividade_criada') || 'null');

            if (ultimaAtividade) {
                if (ultimaAtividade.titulo) document.getElementById('conf-titulo').value = ultimaAtividade.titulo;
                if (ultimaAtividade.dataInicio) {
                    document.getElementById('conf-dataInicio').value = formatarData(ultimaAtividade.dataInicio);
                }
                if (ultimaAtividade.dataVencimento) {
                    document.getElementById('conf-dataVencimento').value = formatarData(ultimaAtividade.dataVencimento);
                }
                if (ultimaAtividade.responsavel) document.getElementById('conf-responsavel').value = ultimaAtividade.responsavel;
                if (ultimaAtividade.participantes) document.getElementById('conf-participantes').value = ultimaAtividade.participantes;
                if (ultimaAtividade.prioridade) document.getElementById('conf-prioridade').textContent = ultimaAtividade.prioridade;
            }

            function formatarData(dataStr) {
                if (!dataStr) return '';
                if (dataStr.includes('-')) {
                    const partes = dataStr.split('-');
                    return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
                return dataStr;
            }
        });
    </script>

</body>

</html>
