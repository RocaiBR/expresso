<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <link rel="stylesheet" href="../assets/css/global.css">
</head>

<body>

    <header class="topo">
        <h1>Expresso — Usuários</h1>
        <div class="topo-direita">
            <span id="nome-logado"></span>
            <button class="botao-sair" id="btn-sair">Sair</button>
        </div>
    </header>

    <main class="conteudo">

        <div class="aviso sucesso" id="aviso-sucesso"></div>
        <div class="aviso erro" id="aviso-erro"></div>

        <!-- FORMULÁRIO: serve para criar (POST) e para editar (PUT) -->
        <section class="cartao">
            <h2 id="titulo-formulario">Novo usuário</h2>

            <form id="form-usuario">
                <!-- guarda o id quando está editando; vazio significa "criando" -->
                <input type="hidden" id="usuario-id">

                <div class="linha-campos">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha">
                    </div>
                </div>

                <div class="acoes-formulario">
                    <button type="submit" class="botao" id="btn-salvar">Cadastrar</button>
                    <button type="button" class="botao botao-secundario" id="btn-cancelar" style="display:none;">
                        Cancelar edição
                    </button>
                </div>
            </form>
        </section>

        <!-- TABELA: o READ do CRUD -->
        <section class="cartao">
            <h2>Usuários cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th style="width:60px;">ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th style="width:170px;">Cadastrado em</th>
                        <th style="width:150px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela"></tbody>
            </table>

            <div class="vazio" id="mensagem-vazio" style="display:none;">
                Nenhum usuário cadastrado ainda.
            </div>
        </section>

    </main>

    <script src="../assets/js/usuarios.js"></script>
</body>

</html>
