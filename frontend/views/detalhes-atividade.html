    <script>

        // =====================================================
        // PEGA O CÓDIGO DA URL
        // =====================================================

        function pegarCodigo() {

            const parametros = new URLSearchParams(
                window.location.search
            );

            return parametros.get("codigo");
        }



        // =====================================================
        // FORMATA DATA
        // =====================================================

        function formatarData(data) {

            if (!data) {
                return "-";
            }

            if (!data.includes("-")) {
                return data;
            }

            const partes = data.split("-");

            if (partes.length !== 3) {
                return data;
            }

            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }



        // =====================================================
        // PEGA AS ATIVIDADES SALVAS
        // =====================================================

        function pegarAtividadesSalvas() {

            try {

                return JSON.parse(
                    localStorage.getItem("atividades_novas") || "[]"
                );

            } catch (erro) {

                console.error(
                    "Erro ao ler atividades:",
                    erro
                );

                return [];

            }

        }



        // =====================================================
        // ATIVIDADES FIXAS
        // =====================================================

        const atividadesFixas = {

            "#001": {

                codigo: "#001",
                titulo: "Reunião com equipe de Projetos",
                responsavel: "Isadora Cabral dos Santos",
                participantes: "Equipe de Projetos",
                dataInicio: "2026-06-09",
                dataVencimento: "2026-06-09",
                prioridade: "Alta",
                descricao: "Reunião com a equipe de Projetos.",
                status: "Concluída"

            },


            "#002": {

                codigo: "#002",
                titulo: "Entrega do planejamento semanal",
                responsavel: "Maiko Fernandes",
                participantes: "Equipe",
                dataInicio: "2026-06-15",
                dataVencimento: "2026-06-15",
                prioridade: "Média",
                descricao: "Entrega do planejamento semanal.",
                status: "Concluída"

            },


            "#004": {

                codigo: "#004",
                titulo: "Marcar reunião",
                responsavel: "Ícaro Guminiak de Godoy",
                participantes: "Equipe",
                dataInicio: "2026-07-30",
                dataVencimento: "2026-07-30",
                prioridade: "Baixa",
                descricao: "Marcar reunião.",
                status: "Pendente"

            },


            "#005": {

                codigo: "#005",
                titulo: "Revisão desenhos CPFBNR",
                responsavel: "Isadora Cabral dos Santos",
                participantes: "Equipe",
                dataInicio: "2026-08-06",
                dataVencimento: "2026-08-06",
                prioridade: "Alta",
                descricao: "Revisão dos desenhos CPFBNR.",
                status: "Pendente"

            }

        };



        // =====================================================
        // CARREGA ATIVIDADE
        // =====================================================

        function carregarAtividade() {

            const codigo = pegarCodigo();


            // -------------------------------------------------
            // SE NÃO TIVER CÓDIGO
            // -------------------------------------------------

            if (!codigo) {

                mostrarAtividadeNaoEncontrada(
                    "Código da atividade não informado."
                );

                return;

            }


            // -------------------------------------------------
            // PRIMEIRO PROCURA NAS ATIVIDADES NOVAS
            // -------------------------------------------------

            const atividadesSalvas =
                pegarAtividadesSalvas();


            const atividadeNova =
                atividadesSalvas.find(
                    atividade =>
                        atividade.codigo === codigo
                );


            if (atividadeNova) {

                preencherAtividade(
                    atividadeNova
                );

                verificarBotoes(
                    atividadeNova
                );

                return;

            }


            // -------------------------------------------------
            // DEPOIS PROCURA NAS ATIVIDADES FIXAS
            // -------------------------------------------------

            const atividadeFixa =
                atividadesFixas[codigo];


            if (atividadeFixa) {

                preencherAtividade(
                    atividadeFixa
                );

                verificarBotoes(
                    atividadeFixa
                );

                return;

            }


            // -------------------------------------------------
            // NÃO ENCONTROU
            // -------------------------------------------------

            mostrarAtividadeNaoEncontrada(
                "Atividade não encontrada."
            );

        }



        // =====================================================
        // PREENCHE OS DADOS DA ATIVIDADE
        // =====================================================

        function preencherAtividade(atividade) {

            document.getElementById(
                "codigoAtividade"
            ).textContent =
                atividade.codigo || "#---";


            document.getElementById(
                "tituloAtividade"
            ).textContent =
                atividade.titulo || "Sem título";


            document.getElementById(
                "tituloPagina"
            ).textContent =
                atividade.titulo || "Detalhes da atividade";


            document.getElementById(
                "responsavelAtividade"
            ).textContent =
                atividade.responsavel ||
                "Não atribuído";


            document.getElementById(
                "prioridadeAtividade"
            ).textContent =
                atividade.prioridade ||
                "Não informada";


            document.getElementById(
                "dataInicioAtividade"
            ).textContent =
                formatarData(
                    atividade.dataInicio
                );


            document.getElementById(
                "dataVencimentoAtividade"
            ).textContent =
                formatarData(
                    atividade.dataVencimento
                );


            document.getElementById(
                "participantesAtividade"
            ).textContent =
                atividade.participantes ||
                "Nenhum participante informado";


            document.getElementById(
                "descricaoAtividade"
            ).textContent =
                atividade.descricao ||
                "Nenhuma descrição informada";


            // -------------------------------------------------
            // STATUS
            // -------------------------------------------------

            const status =
                atividade.status ||
                "Pendente";


            atualizarVisualStatus(
                status
            );

        }



        // =====================================================
        // MOSTRA ATIVIDADE NÃO ENCONTRADA
        // =====================================================

        function mostrarAtividadeNaoEncontrada(mensagem) {

            document.getElementById(
                "codigoAtividade"
            ).textContent =
                pegarCodigo() || "#---";


            document.getElementById(
                "tituloPagina"
            ).textContent =
                "Atividade não encontrada";


            document.getElementById(
                "tituloAtividade"
            ).textContent =
                "Atividade não encontrada";


            document.getElementById(
                "statusAtividade"
            ).textContent =
                "Não encontrada";


            document.getElementById(
                "responsavelAtividade"
            ).textContent =
                "-";


            document.getElementById(
                "prioridadeAtividade"
            ).textContent =
                "-";


            document.getElementById(
                "dataInicioAtividade"
            ).textContent =
                "-";


            document.getElementById(
                "dataVencimentoAtividade"
            ).textContent =
                "-";


            document.getElementById(
                "participantesAtividade"
            ).textContent =
                "-";


            document.getElementById(
                "descricaoAtividade"
            ).textContent =
                mensagem;


            document.getElementById(
                "btnCancelar"
            ).style.display =
                "none";


            document.getElementById(
                "btnConcluir"
            ).style.display =
                "none";

        }



        // =====================================================
        // ATUALIZA VISUAL DO STATUS
        // =====================================================

        function atualizarVisualStatus(status) {

            const elemento =
                document.getElementById(
                    "statusAtividade"
                );


            elemento.textContent =
                status;


            elemento.className =
                "px-4 py-2 rounded-full text-sm font-semibold";


            if (status === "Concluída") {

                elemento.classList.add(
                    "bg-[#e7e7e9]",
                    "text-[#54565B]"
                );

            }

            else if (status === "Cancelada") {

                elemento.classList.add(
                    "bg-[#f4e8f0]",
                    "text-[#6F0049]"
                );

            }

            else if (status === "Em andamento") {

                elemento.classList.add(
                    "bg-[#f4e8f0]",
                    "text-[#6F0049]"
                );

            }

            else {

                elemento.classList.add(
                    "bg-[#f4e8f0]",
                    "text-[#6F0049]"
                );

            }

        }



        // =====================================================
        // VERIFICA OS BOTÕES DE ACORDO COM O STATUS
        // =====================================================

        function verificarBotoes(atividade) {

            const btnCancelar =
                document.getElementById(
                    "btnCancelar"
                );

            const btnConcluir =
                document.getElementById(
                    "btnConcluir"
                );


            const status =
                atividade.status ||
                "Pendente";


            // -----------------------------------------------
            // JÁ CONCLUÍDA
            // -----------------------------------------------

            if (status === "Concluída") {

                btnConcluir.disabled = true;

                btnConcluir.classList.add(
                    "opacity-50",
                    "cursor-not-allowed"
                );

            }


            // -----------------------------------------------
            // JÁ CANCELADA
            // -----------------------------------------------

            if (status === "Cancelada") {

                btnCancelar.disabled = true;

                btnCancelar.classList.add(
                    "opacity-50",
                    "cursor-not-allowed"
                );

            }

        }



        // =====================================================
        // ATUALIZA UMA ATIVIDADE NO LOCALSTORAGE
        // =====================================================

        function atualizarStatus(codigo, novoStatus) {

            const atividades =
                pegarAtividadesSalvas();


            const indice =
                atividades.findIndex(
                    atividade =>
                        atividade.codigo === codigo
                );


            // -------------------------------------------------
            // ATIVIDADE FIXA
            // -------------------------------------------------

            if (indice === -1) {

                alert(
                    "Esta atividade fixa não pode ser alterada nesta versão."
                );

                return false;

            }


            // -------------------------------------------------
            // ATUALIZA STATUS
            // -------------------------------------------------

            atividades[indice].status =
                novoStatus;


            localStorage.setItem(
                "atividades_novas",
                JSON.stringify(
                    atividades
                )
            );


            return true;

        }



        // =====================================================
        // CANCELAR ATIVIDADE
        // =====================================================

        document
            .getElementById("btnCancelar")
            .addEventListener(
                "click",
                function () {

                    const codigo =
                        pegarCodigo();


                    if (!codigo) {

                        alert(
                            "Não foi possível identificar a atividade."
                        );

                        return;

                    }


                    const confirmar =
                        confirm(
                            "Tem certeza que deseja cancelar esta atividade?"
                        );


                    if (!confirmar) {

                        return;

                    }


                    const sucesso =
                        atualizarStatus(
                            codigo,
                            "Cancelada"
                        );


                    if (!sucesso) {

                        return;

                    }


                    atualizarVisualStatus(
                        "Cancelada"
                    );


                    alert(
                        "Atividade cancelada com sucesso!"
                    );


                    const btn =
                        document.getElementById(
                            "btnCancelar"
                        );


                    btn.disabled =
                        true;


                    btn.classList.add(
                        "opacity-50",
                        "cursor-not-allowed"
                    );

                }
            );



        // =====================================================
        // CONCLUIR ATIVIDADE
        // =====================================================

        document
            .getElementById("btnConcluir")
            .addEventListener(
                "click",
                function () {

                    const codigo =
                        pegarCodigo();


                    if (!codigo) {

                        alert(
                            "Não foi possível identificar a atividade."
                        );

                        return;

                    }


                    const sucesso =
                        atualizarStatus(
                            codigo,
                            "Concluída"
                        );


                    if (!sucesso) {

                        return;

                    }


                    atualizarVisualStatus(
                        "Concluída"
                    );


                    alert(
                        "Atividade concluída com sucesso!"
                    );


                    const btn =
                        document.getElementById(
                            "btnConcluir"
                        );


                    btn.disabled =
                        true;


                    btn.classList.add(
                        "opacity-50",
                        "cursor-not-allowed"
                    );

                }
            );



        // =====================================================
        // INICIALIZAÇÃO
        // =====================================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                carregarAtividade();

            }
        );

    </script>
